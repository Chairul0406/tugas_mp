name: Auto Release Android APK on Push

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Get Latest Commit & Generate Changelog
        id: commit_info
        shell: bash
        run: |
          echo "COMMIT_MSG=$(git log -1 --pretty=format:'%s' | tr '\n' ' ')" >> $GITHUB_OUTPUT
          echo "COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an' | tr '\n' ' ')" >> $GITHUB_OUTPUT
          
          {
            echo "CHANGELOG<<EOF"
            git log -n 5 --pretty=format:"- %s (%an)"
            echo ""
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Determine Tag and Release Name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)
            echo "tag_name=v1.0-${COMMIT_SHA_SHORT}" >> $GITHUB_OUTPUT
            echo "release_name=Warteg Online Build (${COMMIT_SHA_SHORT})" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.release_name }}
          tag_name: ${{ steps.tag.outputs.tag_name }}
          prerelease: ${{ steps.tag.outputs.is_prerelease }}
          body: |
            ## 🚀 Warteg Online - Auto Build & Release
            Release generated automatically on push via GitHub Actions.

            ### 📌 Latest Commit:
            - **Message:** ${{ steps.commit_info.outputs.COMMIT_MSG }}
            - **Author:** ${{ steps.commit_info.outputs.COMMIT_AUTHOR }}

            ### 📝 Recent Changelog (Last 5 Commits):
            ${{ env.CHANGELOG }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
